<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>MISE — Restaurant Intelligence Engine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

    <!-- SPLASH / LOADING SCREEN -->
    <div id="splash-screen">
        <div class="splash-inner">
            <h1 class="splash-logo">MISE</h1>
            <p class="splash-tagline">Restaurant Intelligence Engine</p>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- MAIN APP (hidden until splash finishes) -->
    <div class="app-wrapper" id="app-wrapper" style="display:none;">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#"><i class="bi bi-list"></i></a>
                    </li>
                </ul>
                <span class="navbar-text fw-bold">MISE — Restaurant Intelligence Engine</span>
            </div>
        </nav>

        <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark">
            <div class="sidebar-brand">
                <a href="#" class="brand-link">
                    <span class="brand-text fw-bold fs-4 ms-2">MISE</span>
                </a>
            </div>
            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
                        <li class="nav-item"><a href="#" class="nav-link tab-link active" data-tab="home"><i class="bi bi-speedometer2 me-2"></i>Home</a></li>
                        <li class="nav-item"><a href="#" class="nav-link tab-link" data-tab="inventory"><i class="bi bi-box-seam me-2"></i>Inventory</a></li>
                        <li class="nav-item"><a href="#" class="nav-link tab-link" data-tab="waste-risk"><i class="bi bi-exclamation-triangle me-2"></i>Waste Risk</a></li>
                        <li class="nav-item"><a href="#" class="nav-link tab-link" data-tab="predict"><i class="bi bi-graph-up me-2"></i>Demand Forecast</a></li>
                        <li class="nav-item"><a href="#" class="nav-link tab-link" data-tab="recommend"><i class="bi bi-cart-check me-2"></i>Order Recommendations</a></li>
                    </ul>
                </nav>
            </div>
        </aside>

        <main class="app-main">
            <div class="app-content">
                <div class="container-fluid">

                    <!-- HOME / WIDGETS -->
                    <section id="home" class="tab-panel active">
                        <h3 class="mb-4">Overview</h3>
                        <div class="row" id="widget-row"></div>
                    </section>

                    <section id="inventory" class="tab-panel">
                        <h3 class="mb-4">Current Inventory</h3>
                        <div id="inventory-table"></div>
                    </section>

                    <section id="waste-risk" class="tab-panel">
                        <h3 class="mb-4">Waste Risk Alerts</h3>
                        <div id="waste-risk-table"></div>
                    </section>

                    <section id="predict" class="tab-panel">
                        <h3 class="mb-4">Demand Forecast</h3>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" id="predict-date" class="form-control w-auto d-inline-block" value="2026-08-08">
                            <button id="predict-btn" class="btn btn-primary">Predict</button>
                        </div>
                        <div id="predict-table"></div>
                    </section>

                    <section id="recommend" class="tab-panel">
                        <h3 class="mb-4">Order Recommendations</h3>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" id="recommend-date" class="form-control w-auto d-inline-block" value="2026-08-08">
                            <button id="recommend-btn" class="btn btn-primary">Get Recommendations</button>
                        </div>
                        <div id="recommend-table"></div>
                    </section>

                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4/dist/js/adminlte.min.js"></script>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
